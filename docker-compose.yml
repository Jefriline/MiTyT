services:
  # Los estaticos se generan en la imagen en /app/static; si montamos el volumen
  # en /app/static, se oculta ese contenido y el volumen queda vacio. Por eso
  # montamos en /output y al arrancar copiamos /app/static al volumen.
  client_builder:
    build:
      context: ./Client
      dockerfile: dockerfile
    volumes:
      - client_assets:/output
    command: ["sh", "-c", "cp -r /app/static/. /output/. && echo Assets built successfully"]
  server:
    image: mityt-server
    build:
      context: ./server
      dockerfile: dockerfile
    depends_on:
      client_builder:
        condition: service_completed_successfully
    ports:
      - "80:5000"
    env_file:
      - ./server/.env
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./server:/app
      - ./Client/templates:/Client/templates
      - client_assets:/Client/static
    restart: always

  email_worker:
    image: mityt-server
    command: ["python", "scripts/run_email_worker.py"]
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    depends_on:
      server:
        condition: service_started
    restart: always

volumes:
  client_assets: