services:
  redis: 
    image: redis:7-alpine
    container_name: miTyT_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  # Los estaticos se generan en la imagen en /app/static; si montamos el volumen
  # en /app/static, se oculta ese contenido y el volumen queda vacio. Por eso
  # montamos en /output y al arrancar copiamos /app/static al volumen.
  client_builder:
    image: mityt-server
    build:
      context: ./Client
      dockerfile: dockerfile
    volumes:
      - client_assets:/output
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    image: mityt-server:latest
    depends_on:
      redis:
        condition: service_healthy  
      client_builder:
        condition: service_completed_successfully
    ports:
      - "80:5000"
    env_file:
      - ./server/.env
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./Client/templates:/Client/templates:ro
      - client_assets:/Client/static:ro
    restart: always

  email_worker:
    image: mityt-server:latest
    command: ["python", "scripts/run_email_worker.py"]
    env_file: 
      - ./server/.env
    volumes:
      - ./server:/app
    depends_on:
      server:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

volumes:
  client_assets: