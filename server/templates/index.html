{% extends "layout.html" %}

{% block title %}Buscar - MiTyT{% endblock %}

{% block content %}
  <div class="flex flex-col items-center justify-center min-h-96 py-12">
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold text-gray-900 mb-4">Bienvenido a MiTyT</h1>
      <p class="text-xl text-gray-600">Encuentra información sobre las pruebas TyT</p>
    </div>

    <div class="w-full max-w-2xl">
      <form id="searchForm" class="flex gap-2">
        <div class="flex-grow relative">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar información..."
            class="w-full px-6 py-4 text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 shadow-lg transition"
          />
        </div>
        <button
          id="submit"
          type="submit"
          class="bg-blue-600 text-white px-8 py-4 rounded-lg hover:bg-blue-700 transition font-semibold text-lg shadow-lg"
        >
          Buscar
        </button>
      </form>
    </div>
  </div>

  <div id="resultsContainer" class="hidden mt-12">
    <h2 class="text-3xl font-bold text-gray-900 mb-6">Resultados de búsqueda</h2>
    <div id="resultsList" class="space-y-4">
    </div>
  </div>

{% endblock %}
