<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MiTyT{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
<body class="flex flex-col min-h-screen bg-gray-50">
  <nav class="bg-white shadow-md flex-none">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-14">
        <div class="flex-shrink-0">
          <a href="/" class="text-2xl font-bold text-[#39A900]">Consulta de información</a>
        </div>
        <ul class="flex h-auto w-[30%] px-4 justify-center items-center space-x-6">
          <li class="flex w-full justify-around items-center">
            <a href="/" class="text-gray-700 hover:text-[#39A900] transition">Inicio</a>
            
          {% if session.get('login_user') %}
            <a href="/users/perfil" class="ml-4 text-gray-700 hover:text-[#39A900] transition">Perfil</a>
            <a href="/users/logout" class="ml-4 text-gray-700 hover:text-[#39A900] transition">Cerrar sesión</a>
          {%else %}
            <a href="/users/login" class="text-gray-700 hover:text-[#39A900] transition">Iniciar sesión</a>
          {% endif %}
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow flex flex-col"> 
    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-5 py-5 flex-grow flex flex-col">
      {% block content %}
      {% endblock %}
    </div>
  </main>

  <footer class="bg-[#39A900] text-gray-300 ">
    <div class="flex max-w-6xl mx-auto px-4 sm:px-6 lg:px-2 py-1 items-center justify-center">
      <div class="flex w-[50%] flex-col items-center justify-center space-y-2">
          <ul class="flex space-x-4 py-2 text-sm items-center justify-center">
            <li><a href="https://www.icfes.gov.co/" class="hover:text-white transition">Acceso a Icfes</a></li>
            <li><a href="/Ayuda" class="hover:text-white transition">Ayuda en Incripción </a></li>
          </ul>
        <hr class="w-full border-gray-600 " />
        <div class="">
           <p class="text-center text-sm">&copy; 2026. Todos los derechos reservados.</p>
        </div>  
      </div>
    </div>
  </footer>
</body>
</html>
